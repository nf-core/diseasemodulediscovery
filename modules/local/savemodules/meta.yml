name: savemodules
description: Exports a disease module as a GraphML network and as node and edge tables
keywords:
  - export
  - format conversion
  - disease module
  - graphml
  - tsv
tools:
  - savemodules:
      description: In-house Python script (save_modules.py) that writes a module network
        to GraphML and turns its vertex and edge properties into tab-separated node and
        edge tables.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis
        of graphs, implemented in C++ on top of the Boost Graph Library. It also defines
        the binary `.gt` network format.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id`
          field
    - module:
        type: file
        description: Disease module network in graph-tool binary format. Its nodes need
          a `name`, a `component_id` and an `is_seed` property, since these are used
          to order the node table.
output:
  graphml:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.graphml:
          type: file
          description: The module network in GraphML format, keeping all of its node
            and edge properties
          pattern: ${meta.id}.graphml
  nodes_tsv:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.nodes.tsv:
          type: file
          description: Tab-separated table with one row per module node, indexed by the
            node identifier and holding one column per node property. The rows are grouped
            by connected component, with the seed nodes first.
          pattern: ${meta.id}.nodes.tsv
  edges_tsv:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.edges.tsv:
          type: file
          description: Tab-separated table with one row per module edge, indexed by the
            `source` and `target` node identifiers and holding one column per edge property
          pattern: ${meta.id}.edges.tsv
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
