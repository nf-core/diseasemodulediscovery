name: visualizemodulesdrugs
description: Draws a disease module network together with the drugs targeting its nodes, as static images and as an interactive HTML page
keywords:
  - visualization
  - network
  - disease module
  - drugs
  - interactive
tools:
  - visualizemodulesdrugs:
      description: In-house Python script (visualize_modules.py) that adds the predicted drugs to a module network as additional nodes connected to the nodes they target, lays the result out and renders it both as static images and as an interactive page in which every node exposes its properties.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis of graphs, implemented in C++ on top of the Boost Graph Library. Used to compute the SFDP layout and to render the static images.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
  - networkx:
      description: Python package for the creation, manipulation and study of the structure and dynamics of complex networks. Used as the intermediate representation for the interactive output.
      homepage: https://networkx.org/
      documentation: https://networkx.org/documentation/stable/
      licence:
        - BSD-3-Clause
  - pyintergraph:
      description: Converts graph objects between networkx, python-igraph and graph-tool. Used to turn the module into a networkx graph.
      homepage: https://github.com/luerhard/pyintergraph
      documentation: https://github.com/luerhard/pyintergraph
      licence:
        - MIT
  - pyvis:
      description: Python library for interactive network visualizations in the browser. Used to write the interactive HTML page.
      homepage: https://github.com/WestHealth/pyvis
      documentation: https://pyvis.readthedocs.io/en/latest/
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id` field
    - module:
        type: file
        description: Disease module network in graph-tool binary format. Its nodes need a `name`, an `is_seed` and a `component_id` property, the first two to label and color them and the last one to order the property tables shown in the interactive output.
    - drug_predictions:
        type: file
        description: Tab-separated table of drug predictions with a `name` column holding the identifier of the targeted node and a `drug_name` column holding the name of the drug. Rows without a drug name are skipped, and if the column is missing entirely no drugs are added at all.
output:
  pdf:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.pdf:
          type: file
          description: The laid out module network including the drug nodes as PDF. Seed nodes, added nodes and drugs are distinguished by color and shape, and every node is labelled.
          pattern: ${meta.id}.pdf
  png:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.png:
          type: file
          description: The same drawing as PNG, rendered at a larger output size
          pattern: ${meta.id}.png
  svg:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.svg:
          type: file
          description: The same drawing as SVG
          pattern: ${meta.id}.svg
  html:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.html:
          type: file
          description: Interactive rendering of the module network including the drug nodes, using the same layout as the static images. Hovering a node shows all of its properties, and the physics, interaction and manipulation settings can be changed in the page.
          pattern: ${meta.id}.html
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_graphtool:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - graph-tool:
          type: string
          description: The tool name
      - python -c "import graph_tool; print(graph_tool.__version__)" | cut -d" " -f1:
          type: eval
          description: The expression to obtain the version of the tool
  versions_networkx:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - networkx:
          type: string
          description: The tool name
      - python -c "import networkx; print(networkx.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pyintergraph:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pyintergraph:
          type: string
          description: The tool name
      - "pip show pyintergraph | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pyvis:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pyvis:
          type: string
          description: The tool name
      - "pip show pyvis | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
