name: biopax_parser
description: Converts a disease module network into a BioPAX Level 3 OWL file, enriching it with biological annotations queried from NeDRexDB
keywords:
  - biopax
  - disease module
  - network
  - annotation
  - nedrex
  - owl
tools:
  - biopax_parser:
      description: In-house Python script (gt2biopax.py) that converts a graph-tool module network into BioPAX Level 3. Genes, proteins, targeting drugs (including side effects, indications and contraindications), associated disorders and, optionally, genomic variants are queried from NeDRexDB and added as BioPAX entities.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
  - pybiopax:
      description: A Python implementation of the BioPAX object model, and parts of PaxTools. Used to build the BioPAX model and serialise it to OWL.
      homepage: https://github.com/indralab/pybiopax
      documentation: https://pybiopax.readthedocs.io/
      licence:
        - BSD-2-Clause
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis of graphs, implemented in C++ on top of the Boost Graph Library. It also defines the binary `.gt` network format.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id` field
    - network:
        type: file
        description: Disease module network in graph-tool binary format
  - - idspace:
        type: string
        description: ID space of the node identifiers in the module network. Only `entrez` and `uniprot` are supported.
  - - add_variants:
        type: boolean
        description: If true, genomic variants affecting the module genes and their disorder associations are queried from NeDRexDB and added to the BioPAX output (`-v` flag of gt2biopax.py)
output:
  biopax:
    - "*.owl":
        type: file
        description: BioPAX Level 3 representation of the disease module, named after the input module file
        pattern: "*.owl"
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_graphtool:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - graph-tool:
          type: string
          description: The tool name
      - python -c "import graph_tool; print(graph_tool.__version__)" | cut -d" " -f1:
          type: eval
          description: The expression to obtain the version of the tool
  versions_pybiopax:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pybiopax:
          type: string
          description: The tool name
      - python -c "import pybiopax; print(pybiopax.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_requests:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - requests:
          type: string
          description: The tool name
      - python -c "import requests; print(requests.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
