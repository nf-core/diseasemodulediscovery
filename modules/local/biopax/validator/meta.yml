name: biopax_validator
description: Checks BioPAX OWL files for syntactic errors and violations of BioPAX best practices and writes a single HTML validation report
keywords:
  - biopax
  - validation
  - owl
  - quality control
tools:
  - biopax_validator:
      description: Java tool that validates BioPAX Level 3 data against the BioPAX specification and a set of best-practice rules. Run either against the remote validator service or fully offline, in which case the required OBO ontologies are loaded locally.
      homepage: https://biopax.github.io/validator/
      documentation: https://github.com/BioPAX/validator/wiki
      licence:
        - MIT
input:
  - - biopax_files:
        type: file
        description: One or more BioPAX OWL files to validate, staged into the working directory
  - - validate_online:
        type: boolean
        description: If true, validation is delegated to the remote validator service via the validator client. If false, validation runs offline and the OBO files are loaded locally, which is slower but recommended for large inputs.
output:
  validation:
    - biopax-validator-report.html:
        type: file
        description: HTML validation report covering all input files, using the `notstrict` validation profile
        pattern: biopax-validator-report.html
  versions_openjdk:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - openjdk:
          type: string
          description: The tool name
      - java -version 2>&1 | head -n1 | cut -d'"' -f2 | cut -d'-' -f1:
          type: eval
          description: The expression to obtain the version of the tool
  versions_biopaxvalidator:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - biopax-validator:
          type: string
          description: The tool name
      - ls $(dirname $(readlink -f $(which biopax-validator)))/../share | sed -n "s/^biopax-validator-//p":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - openjdk:
          type: string
          description: The tool name
      - java -version 2>&1 | head -n1 | cut -d'"' -f2 | cut -d'-' -f1:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - biopax-validator:
          type: string
          description: The tool name
      - ls $(dirname $(readlink -f $(which biopax-validator)))/../share | sed -n "s/^biopax-validator-//p":
          type: eval
          description: The expression to obtain the version of the tool
