name: moduleparser
description: Converts the raw output of a module inference method into a network in
  the internal graph-tool format
keywords:
  - module
  - format conversion
  - parser
  - disease module
  - seed genes
tools:
  - moduleparser:
      description: In-house Python script (module_parser.py) that reads the tool-specific
        output of a module inference method, extracts the corresponding subnetwork from
        the input network, carries over the node properties the method reports and marks
        the seed nodes.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis
        of graphs, implemented in C++ on top of the Boost Graph Library. It also defines
        the binary `.gt` network format.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id`
          field and an `amim` field naming the module inference method the module was
          produced with, one of `diamond`, `domino`, `robust`, `robust_bias_aware` or
          `rwr`
    - module:
        type: file
        description: Raw module output of the inference method, in the format that method
          writes
    - seeds:
        type: file
        description: Seed nodes the module was generated from, one node identifier per
          line. Empty lines are ignored.
    - network:
        type: file
        description: Interaction network the module was inferred from, either in one
          of the graph formats readable by graph-tool (`.gt`, `.graphml`, `.xml`, `.dot`,
          `.gml`) or as an edge list, with the node identifiers in the `name` vertex
          property
output:
  module:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.gt:
          type: file
          description: The module as a network in graph-tool binary format. All nodes
            carry an `is_seed` vertex property, and the node properties reported by the
            respective method are added on top.
          pattern: ${meta.id}.gt
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@JohannesKersting"
  - "@quirinmanz"
maintainers:
  - "@JohannesKersting"
