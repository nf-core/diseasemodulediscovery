name: seedperturbationevaluation
description: Evaluates how robust a disease module is against leaving out single seeds and how often the omitted seeds are rediscovered
keywords:
  - perturbation
  - leave-one-out
  - robustness
  - rediscovery
  - jaccard
tools:
  - seedperturbationevaluation:
      description: In-house Python script (seed_perturbation_evaluation.py) that compares a reference module against the modules obtained from leave-one-out seed sets, reporting how often an omitted seed is recovered, the Jaccard index between the node sets and four topological measures of the modules.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id` field
    - module:
        type: file
        description: Reference module network in graph-tool binary format, with the node identifiers in the `name` vertex property
  - - seeds:
        type: file
        description: Seed nodes the reference module was built from, one node identifier per line. Lines starting with `#` are skipped and only the first tab-separated column is read.
  - - perturbed_modules:
        type: file
        description: Module networks inferred from the perturbed seed sets, in graph-tool binary format and with the node identifiers in the `name` vertex property
  - - perturbed_seeds:
        type: file
        description: The perturbed seed sets, in the same order as the perturbed modules, one node identifier per line
  - - network:
        type: file
        description: Full interaction network in graph-tool binary format, with the node identifiers in the `name` vertex property
output:
  summary:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.seed_perturbation_evaluation_summary.tsv:
          type: file
          description: Tab-separated table aggregating the results over all perturbations, with one row per measure and the average, the standard deviation and, where applicable, the z-score as columns
          pattern: ${meta.id}.seed_perturbation_evaluation_summary.tsv
  detailed:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.seed_perturbation_evaluation_detailed.tsv:
          type: file
          description: Tab-separated table with one row per perturbation, listing the omitted seeds, the retrieval frequency and its module size normalized variant, the Jaccard index and the topological measures of the perturbed module
          pattern: ${meta.id}.seed_perturbation_evaluation_detailed.tsv
  multiqc_summary:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.seed_perturbation_multiqc_summary.tsv:
          type: file
          description: Single-row tab-separated file with the columns `id`, `avg_jaccard_index`, `rediscovery_rate` and `normalized_rediscovery_rate`
          pattern: ${meta.id}.seed_perturbation_multiqc_summary.tsv
  multiqc_jaccard:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.seed_perturbation_multiqc_jaccard.txt:
          type: file
          description: "Single YAML mapping entry of the form `<id>: [<jaccard indices>]`, listing the Jaccard index of every perturbed module"
          pattern: ${meta.id}.seed_perturbation_multiqc_jaccard.txt
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_graphtool:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - graph-tool:
          type: string
          description: The tool name
      - python -c "import graph_tool; print(graph_tool.__version__)" | cut -d" " -f1:
          type: eval
          description: The expression to obtain the version of the tool
  versions_networkx:
    - - ${task.process}:
          type: string
