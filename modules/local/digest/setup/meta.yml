name: digest_setup
description: Downloads the precomputed mapping files that DIGEST needs to evaluate disease modules
keywords:
  - digest
  - functional coherence
  - setup
  - reference data
tools:
  - digest:
      description: DIGEST (in silico validation of disease and gene sets, clusterings or subnetworks) scores how functionally coherent a set of nodes is, based on Gene Ontology (GO.BP, GO.CC, GO.MF) and KEGG pathway annotations. Its evaluation relies on precomputed ID and attribute mappings, attribute distance matrices and default networks, which are downloaded from the DIGEST API.
      homepage: https://digest-validation.net/
      documentation: https://github.com/bionetslab/digest
      licence:
        - GPL-3.0-or-later
output:
  mapping_files:
    - mapping_files:
        type: directory
        description: Directory with the precomputed DIGEST mapping files, i.e. the ID and attribute mappings, the Jaccard and overlap distance matrices of the attributes, and the default gene and disease networks
        pattern: mapping_files
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_biodigest:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - biodigest:
          type: string
          description: The tool name
      - python -c "from importlib.metadata import version; print(version('biodigest'))":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
