name: networkperturbation
description: Rewires the edges of a network while preserving the degree of every node
keywords:
  - perturbation
  - randomization
  - rewiring
  - network
  - robustness
tools:
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis
        of graphs, implemented in C++ on top of the Boost Graph Library. Its `random_rewire`
        function is used with the `constrained-configuration` model and 100 full sweeps
        over all edges to randomize the network without changing the node degrees.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id`
          field
    - network:
        type: file
        description: Interaction network to rewire, either in one of the graph formats
          readable by graph-tool (`.gt`, `.graphml`, `.xml`, `.dot`, `.gml`) or as an
          edge list
    - output_name:
        type: string
        description: Name of the output file. Its extension decides the format the rewired
          network is written in.
output:
  perturbed_network:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${output_name}:
          type: file
          description: The rewired network, holding the same nodes with the same degrees
            but randomized edges. Rewiring attempts that would create a parallel edge
            or a self-loop are rejected and reported as a warning.
          pattern: ${output_name}
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@JohannesKersting"
  - "@ChloeBubu"
maintainers:
  - "@JohannesKersting"
