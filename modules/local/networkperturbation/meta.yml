name: networkperturbation
description: Rewires the edges of a network while preserving the degree of every node
keywords:
  - perturbation
  - randomization
  - rewiring
  - network
  - robustness
tools:
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis of graphs, implemented in C++ on top of the Boost Graph Library. Its `random_rewire` function is used with the `constrained-configuration` model and 100 full sweeps over all edges to randomize the network without changing the node degrees.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id` field
    - network:
        type: file
        description: Interaction network to rewire, either in one of the graph formats readable by graph-tool (`.gt`, `.graphml`, `.xml`, `.dot`, `.gml`) or as an edge list
    - output_name:
        type: string
        description: Name of the output file. Its extension decides the format the rewired network is written in.
output:
  perturbed_network:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${output_name}:
          type: file
          description: The rewired network, holding the same nodes with the same degrees but randomized edges. Rewiring attempts that would create a parallel edge or a self-loop are rejected and reported as a warning.
          pattern: ${output_name}
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python3 --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_graphtool:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - graph-tool:
          type: string
          description: The tool name
      - python -c "import graph_tool; print(graph_tool.__version__)" | cut -d" " -f1:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python3 --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - graph-tool:
          type: string
          description: The tool name
      - python -c "import graph_tool; print(graph_tool.__version__)" | cut -d" " -f1:
          type: eval
          description: The expression to obtain the version of the tool
