name: sca
description: Identifies a disease module from the seed nodes with the SCA algorithm
keywords:
  - sca
  - disease module
  - module identification
tools:
  - sca:
      description: SCA expands a set of seed nodes into a disease module using the network topology (bin/SCA2024.py).
      homepage: https://github.com/repo4eu/modulediscovery
      documentation: https://github.com/repo4eu/modulediscovery
      licence:
        - ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id` field
    - seeds:
        type: file
        description: Seed nodes to build the module from, one node identifier per line
    - network:
        type: file
        description: Interaction network as a tab-separated edge list
output:
  module:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - Predicted_genelist.txt:
          type: file
          description: The disease module as a list of genes
          pattern: Predicted_genelist.txt
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@Schansiate"
maintainers:
  - "@Schansiate"
