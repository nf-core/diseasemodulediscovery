name: drugstoneexport
description: Registers a disease module network with the Drugst.One platform and returns
  a link that opens it in the Drugst.One web interface
keywords:
  - drugstone
  - export
  - visualization
  - disease module
  - drug repurposing
tools:
  - drugstone:
      description: Web platform for network-based systems medicine and drug repurposing.
        Its API is used to register the module network, so that it can be explored and
        manipulated interactively in the Drugst.One web interface.
      homepage: https://drugst.one/
      documentation: https://drugst.one/doc
      licence:
        - GPL-3.0
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis
        of graphs, implemented in C++ on top of the Boost Graph Library. It also defines
        the binary `.gt` network format.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id`
          field
    - module:
        type: file
        description: Disease module network in graph-tool binary format. The `name`
          vertex property provides the node identifiers and `is_seed` decides whether
          a node is registered as a seed node or as a found node.
  - - id_space:
        type: string
        description: ID space of the node identifiers, passed to Drugst.One as the identifier
          type of the network
output:
  link:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.drugstonelink.tsv:
          type: file
          description: Single-row tab-separated file with the columns `Module_id`, `drugstone_link`
            and `link_raw`. `drugstone_link` wraps the URL in an HTML anchor for embedding
            in a report, `link_raw` holds the plain URL.
          pattern: ${meta.id}.drugstonelink.tsv
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@JohannesKersting"
  - "@Schansiate"
maintainers:
  - "@JohannesKersting"
