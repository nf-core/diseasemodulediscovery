name: domino_slicer
description: Partitions a network into disjoint slices via modularity optimization,
  the preprocessing step of DOMINO
keywords:
  - domino
  - slicer
  - network partitioning
  - louvain
  - preprocessing
tools:
  - domino_slicer:
      description: Preprocessing step shipped with DOMINO that partitions a network
        into disjoint slices using Louvain modularity optimization. The resulting slices
        depend only on the network and can be reused for any seed set.
      homepage: https://github.com/Shamir-Lab/DOMINO
      documentation: https://github.com/Shamir-Lab/DOMINO
      licence:
        - MIT
  - python-louvain:
      description: Implementation of the Louvain method for community detection in large
        networks.
      homepage: https://github.com/taynaud/python-louvain
      documentation: https://github.com/taynaud/python-louvain
      licence:
        - BSD-3-Clause
  - networkx:
      description: Python package for the creation, manipulation and study of the structure
        and dynamics of complex networks.
      homepage: https://networkx.org/
      documentation: https://networkx.org/documentation/stable/
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id`
          field
    - network:
        type: file
        description: Interaction network as a tab-separated SIF file with the header
          columns `node_1`, `type` and `node_2`
output:
  slices:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.slices.txt:
          type: file
          description: "Text file listing the network slices. The first line reports
            the total number of slices, and every slice is given as a `cc #<i>: n=<size>`
            line followed by a bracketed, comma-separated list of its node identifiers."
          pattern: ${meta.id}.slices.txt
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@JohannesKersting"
maintainers:
  - "@JohannesKersting"
