name: domino_slicer
description: Partitions a network into disjoint slices via modularity optimization, the preprocessing step of DOMINO
keywords:
  - domino
  - slicer
  - network partitioning
  - louvain
  - preprocessing
tools:
  - domino_slicer:
      description: Preprocessing step shipped with DOMINO that partitions a network into disjoint slices using Louvain modularity optimization. The resulting slices depend only on the network and can be reused for any seed set.
      homepage: https://github.com/Shamir-Lab/DOMINO
      documentation: https://github.com/Shamir-Lab/DOMINO
      licence:
        - MIT
  - python-louvain:
      description: Implementation of the Louvain method for community detection in large networks.
      homepage: https://github.com/taynaud/python-louvain
      documentation: https://github.com/taynaud/python-louvain
      licence:
        - BSD-3-Clause
  - networkx:
      description: Python package for the creation, manipulation and study of the structure and dynamics of complex networks.
      homepage: https://networkx.org/
      documentation: https://networkx.org/documentation/stable/
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id` field
    - network:
        type: file
        description: Interaction network as a tab-separated SIF file with the header columns `node_1`, `type` and `node_2`
output:
  slices:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.id}.slices.txt:
          type: file
          description: "Text file listing the network slices. The first line reports the total number of slices, and every slice is given as a `cc #<i>: n=<size>` line followed by a bracketed, comma-separated list of its node identifiers."
          pattern: ${meta.id}.slices.txt
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_domino:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - domino:
          type: string
          description: The tool name
      - python -c "import json,importlib.metadata as m; u=json.loads(m.distribution('domino-python').read_text('direct_url.json'))['url']; print(u.rsplit('/',1)[-1].removeprefix('v').removesuffix('.tar.gz'))":
          type: eval
          description: The expression to obtain the version of the tool
  versions_pythonlouvain:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python-louvain:
          type: string
          description: The tool name
      - "pip show python-louvain | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_networkx:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - networkx:
          type: string
          description: The tool name
      - "pip show networkx | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - numpy:
          type: string
          description: The tool name
      - "pip show numpy | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
