name: rwr
description: Ranks the nodes of a network by their proximity to the seed nodes using a random walk with restart
keywords:
  - rwr
  - random walk with restart
  - network propagation
  - disease module
  - seed genes
tools:
  - rwr:
      description: In-house Python script (rwr.py) that performs a random walk with restart on the network, starting from the seed nodes, and returns the connected module formed by the highest ranking nodes together with their visiting probabilities.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
  - networkx:
      description: Python package for the creation, manipulation and study of the structure and dynamics of complex networks. Used to hold the network the random walk is performed on.
      homepage: https://networkx.org/
      documentation: https://networkx.org/documentation/stable/
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id` field
    - seeds:
        type: file
        description: Seed nodes to start the random walk from, one node identifier per line. If the file has several tab-separated columns, only the first one is used.
    - network:
        type: file
        description: Interaction network as a delimiter-separated edge list whose first two columns are read as the two interacting nodes. The delimiter has to be consistent and must not occur inside the node identifiers.
  - - scaling:
        type: integer
        description: Set to 1 to scale the visiting probabilities of the nodes by the square root of their degree, 0 to use them unscaled
  - - symmetrical:
        type: integer
        description: Set to 1 to use the symmetric Markov matrix, 0 to use the column-wise normalized one
  - - r:
        type: number
        description: Damping factor, i.e. the restart probability of the random walk
output:
  module:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - "*.txt":
          type: file
          description: Tab-separated table of the module nodes with the columns `#rank`, `RWR_node` and `visiting_probability`, ordered by descending visiting probability. The file name encodes the chosen scaling, Markov matrix and damping factor.
          pattern: "*.txt"
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
  versions_networkx:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - networkx:
          type: string
          description: The tool name
      - python -c "import networkx; print(networkx.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_scipy:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - scipy:
          type: string
          description: The tool name
      - python -c "import scipy; print(scipy.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
  versions_numpy:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - numpy:
          type: string
          description: The tool name
      - python -c "import numpy; print(numpy.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
