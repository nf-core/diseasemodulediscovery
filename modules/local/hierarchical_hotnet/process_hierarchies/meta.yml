name: hierarchical_hotnet_process_hierarchies
description: Compares original and permuted hierarchies and identifies significant clusters with Hierarchical HotNet
keywords:
  - hierarchical hotnet
  - disease module
  - module identification
tools:
  - hierarchical_hotnet_process_hierarchies:
      description: Hierarchical HotNet identifies significantly altered subnetworks using a hierarchy of strongly connected components.
      homepage: https://github.com/raphael-group/hierarchical-hotnet
      documentation: https://github.com/raphael-group/hierarchical-hotnet
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - original_hierarchy_edges:
        type: file
        description: File used by the Hierarchical HotNet step
    - original_hierarchy_nodes:
        type: file
        description: File used by the Hierarchical HotNet step
    - permuted_hierarchy_edges:
        type: file
        description: File used by the Hierarchical HotNet step
    - permuted_hierarchy_nodes:
        type: file
        description: File used by the Hierarchical HotNet step
  - - lower_size_bound:
        type: string
        description: File used by the Hierarchical HotNet step
output:
  modules:
    - meta:
        type: map
        description: Groovy Map containing sample information
    - ${meta.id}.module:
        type: file
        description: File used by the Hierarchical HotNet step
        pattern: ${meta.id}.module
  versions:
    - versions.yml:
        type: file
        description: File used by the Hierarchical HotNet step
        pattern: versions.yml
authors:
  - "@Schansiate"
maintainers:
  - "@Schansiate"
containers:
