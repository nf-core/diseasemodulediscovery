name: hierarchical_hotnet_construct_hierarchies
description: Constructs a hierarchy of strongly connected components from a similarity matrix and node scores with Hierarchical HotNet
keywords:
  - hierarchical hotnet
  - disease module
  - module identification
tools:
  - hierarchical_hotnet_construct_hierarchies:
      description: Hierarchical HotNet identifies significantly altered subnetworks using a hierarchy of strongly connected components.
      homepage: https://github.com/raphael-group/hierarchical-hotnet
      documentation: https://github.com/raphael-group/hierarchical-hotnet
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - nodes:
        type: file
        description: File used by the Hierarchical HotNet step
    - edges:
        type: file
        description: File used by the Hierarchical HotNet step
    - similarity_matrix:
        type: file
        description: File used by the Hierarchical HotNet step
    - node_score:
        type: file
        description: File used by the Hierarchical HotNet step
    - permutation:
        type: string
        description: File used by the Hierarchical HotNet step
output:
  hierarchy:
    - meta:
        type: map
        description: Groovy Map containing sample information
    - ${meta.id}.hierarchy_edge_list*:
        type: file
        description: File used by the Hierarchical HotNet step
        pattern: ${meta.id}.hierarchy_edge_list*
  versions:
    - versions.yml:
        type: file
        description: File used by the Hierarchical HotNet step
        pattern: versions.yml
authors:
  - "@Schansiate"
maintainers:
  - "@Schansiate"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/hierarchical_hotnet:8bea4d8e8f9b32f2
      build_id: bd-8bea4d8e8f9b32f2_1
      scan_id: sc-3e30cc68b418a9bb_1
