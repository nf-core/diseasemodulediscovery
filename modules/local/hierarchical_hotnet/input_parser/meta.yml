name: hierarchical_hotnet_input_parser
description: Converts a network into the node and edge list files that Hierarchical
  HotNet expects
keywords:
  - hierarchical hotnet
  - disease module
tools:
  - input_parser:
      description: Converts a network into the node and edge list files that Hierarchical
        HotNet expects
      homepage: https://github.com/raphael-group/hierarchical-hotnet
      documentation: https://github.com/raphael-group/hierarchical-hotnet
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id`
          field
    - network:
        type: file
        description: Network to convert, as a graph-tool file
output:
  network:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.node_list.tsv":
          type: file
          description: Node list
          pattern: "*.node_list.tsv"
      - "*.edge_list.tsv":
          type: file
          description: Edge list
          pattern: "*.edge_list.tsv"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@Schansiate"
maintainers:
  - "@Schansiate"
