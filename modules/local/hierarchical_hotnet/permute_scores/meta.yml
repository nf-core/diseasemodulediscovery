name: hierarchical_hotnet_permute_scores
description: Permutes node scores while preserving the network structure bins with Hierarchical HotNet
keywords:
  - hierarchical hotnet
  - disease module
  - module identification
tools:
  - hierarchical_hotnet_permute_scores:
      description: Hierarchical HotNet identifies significantly altered subnetworks using a hierarchy of strongly connected components.
      homepage: https://github.com/raphael-group/hierarchical-hotnet
      documentation: https://github.com/raphael-group/hierarchical-hotnet
      licence:
        - BSD-3-Clause
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - node_list:
        type: file
        description: File used by the Hierarchical HotNet step
    - edge_list:
        type: file
        description: File used by the Hierarchical HotNet step
    - node_scores:
        type: file
        description: File used by the Hierarchical HotNet step
  - - num_permutations:
        type: string
        description: File used by the Hierarchical HotNet step
output:
  permuted_scores:
    - meta:
        type: map
        description: Groovy Map containing sample information
    - ${meta.id}.score_permutation*:
        type: file
        description: File used by the Hierarchical HotNet step
        pattern: ${meta.id}.score_permutation*
  versions:
    - versions.yml:
        type: file
        description: File used by the Hierarchical HotNet step
        pattern: versions.yml
authors:
  - "@Schansiate"
maintainers:
  - "@Schansiate"
