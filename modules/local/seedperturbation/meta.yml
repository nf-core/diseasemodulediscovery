name: seedperturbation
description: Creates leave-one-out variants of a seed set, each missing exactly one of the seeds
keywords:
  - perturbation
  - leave-one-out
  - seed genes
  - robustness
tools:
  - seedperturbation:
      description: In-house Python script (seed_perturbation.py) that writes one copy of the given seed set per seed, each of them holding all seeds except that one.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id` field and a `seeds_id` field used to name the output files
    - seeds:
        type: file
        description: Seed nodes to perturb, one node identifier per line. Empty lines are ignored.
output:
  perturbed_seeds:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id` field
      - ${meta.seeds_id}.*.${seeds.extension}:
          type: file
          description: One perturbed seed set per seed of the input, each listing all seeds but the omitted one, one identifier per line. The files are numbered by the position of the omitted seed in the input and keep the extension of the input file.
          pattern: ${meta.seeds_id}.*.${seeds.extension}
  versions_python:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python3 --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - python3 --version | sed 's/Python //g':
          type: eval
          description: The expression to obtain the version of the tool
