name: networkperturbationevaluation
description: Measures how robust a disease module is against rewiring of the underlying
  network, using the Jaccard index
keywords:
  - perturbation
  - robustness
  - jaccard
  - evaluation
  - disease module
tools:
  - networkperturbationevaluation:
      description: In-house Python script (network_perturbation_evaluation.py) that
        compares the node set of a reference module against the node sets of the modules
        obtained from perturbed networks, reporting the individual Jaccard indices and
        their mean.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis
        of graphs, implemented in C++ on top of the Boost Graph Library. It also defines
        the binary `.gt` network format.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id`
          field
    - module:
        type: file
        description: Reference module network in graph-tool binary format, with the
          node identifiers in the `name` vertex property
  - - perturbed_modules:
        type: file
        description: Module networks inferred from the perturbed networks, in graph-tool
          binary format and with the node identifiers in the `name` vertex property
output:
  multiqc_summary:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.network_perturbation_multiqc_summary.tsv:
          type: file
          description: Single-row tab-separated file with the columns `id` and `avg_jaccard_index`,
            holding the mean Jaccard index over all perturbed modules
          pattern: ${meta.id}.network_perturbation_multiqc_summary.tsv
  multiqc_jaccard:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.network_perturbation_multiqc_jaccard.txt:
          type: file
          description: "Single YAML mapping entry of the form `<id>: [<jaccard indices>]`,
            listing the Jaccard index of every perturbed module rounded to four decimals"
          pattern: ${meta.id}.network_perturbation_multiqc_jaccard.txt
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@JohannesKersting"
maintainers:
  - "@JohannesKersting"
