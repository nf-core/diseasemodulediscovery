name: inputcheck
description: Validates a seed file against a network, drops the seeds that are not
  network nodes and extracts the subnetwork induced by the remaining seeds
keywords:
  - input check
  - validation
  - seed genes
  - filtering
  - disease module
tools:
  - inputcheck:
      description: In-house Python script (input_check.py) that splits the given seeds
        into those present in the network and those missing from it, reports both sets
        and saves the subnetwork induced by the retained seeds as a baseline module.
      homepage: https://github.com/nf-core/diseasemodulediscovery
      documentation: https://nf-co.re/diseasemodulediscovery/output
      licence:
        - MIT
  - graph-tool:
      description: Efficient Python module for the manipulation and statistical analysis
        of graphs, implemented in C++ on top of the Boost Graph Library. It also defines
        the binary `.gt` network format.
      homepage: https://graph-tool.skewed.de/
      documentation: https://graph-tool.skewed.de/static/doc/index.html
      licence:
        - LGPL-3.0-or-later
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, must contain an `id`
          field
    - seeds:
        type: file
        description: Seed nodes, one node identifier per line. Empty lines are ignored.
    - network:
        type: file
        description: Interaction network to validate the seeds against, either in one
          of the graph formats readable by graph-tool (`.gt`, `.graphml`, `.xml`, `.dot`,
          `.gml`) or as an edge list, with the node identifiers in the `name` vertex
          property
output:
  seeds:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.tsv:
          type: file
          description: The retained seeds, one node identifier per line without a header.
            Not written if none of the seeds is part of the network.
          pattern: ${meta.id}.tsv
  seeds_module:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.no_tool.gt:
          type: file
          description: Subnetwork induced by the retained seeds in graph-tool binary
            format, serving as a baseline module without any module inference method.
            The added `is_seed` vertex property is true for all of its nodes.
          pattern: ${meta.id}.no_tool.gt
  removed_seeds:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.removed.tsv:
          type: file
          description: The dropped seeds that are not nodes of the network, one identifier
            per line without a header. Not written if all seeds were retained.
          pattern: ${meta.id}.removed.tsv
  multiqc:
    - - meta:
          type: map
          description: Groovy Map containing sample information, must contain an `id`
            field
      - ${meta.id}.multiqc.tsv:
          type: file
          description: Single-row tab-separated summary with the columns `Seed file`,
            `Seeds` (number of retained seeds) and `Not in network` (number of dropped
            seeds)
          pattern: ${meta.id}.multiqc.tsv
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
authors:
  - "@JohannesKersting"
maintainers:
  - "@JohannesKersting"
